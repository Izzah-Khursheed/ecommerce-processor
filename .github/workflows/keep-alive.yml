name: Keep backend awake

# Render's free tier sleeps after ~15 min of inactivity. This workflow pings
# the backend's /health endpoint every 10 minutes so it stays warm.
#
# Change the URL below if your backend URL differs, or set a repo variable
# BACKEND_HEALTH_URL (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (UTC)
  workflow_dispatch: {} # allows manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://ecommerce-processor.onrender.com/health"
          fi
          echo "Pinging $URL"
          # Retry a few times so a cold start (~50s) still gets woken.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Health check did not return 200, but the ping still woke the service."
