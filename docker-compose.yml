# =========================================================================
# Local development infrastructure for ecommerce-processor.
# Everything here is FREE and runs on your machine. Start it with:
#     docker compose up -d
# Check status:   docker compose ps
# Stop:           docker compose down         (add -v to also wipe data)
# =========================================================================
services:
  # ---- PostgreSQL: stores product rows + upload batches ----
  postgres:
    image: postgres:16-alpine
    container_name: ep_postgres
    restart: unless-stopped
    environment:
      # Local-dev defaults; override via a root .env if you like (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # Host 5433 -> avoids clashing with other local Postgres instances.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis: backing store for BullMQ jobs ----
  redis:
    image: redis:7-alpine
    container_name: ep_redis
    restart: unless-stopped
    ports:
      # Host 6380 -> avoids clashing with other local Redis instances.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- RabbitMQ: event bus. Management UI at http://localhost:15672 ----
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ep_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP protocol (the app connects here)
      - "15672:15672"   # Management web UI (open in a browser)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- MinIO: S3-compatible object storage for local dev (free). ----
  #      API at :9000, web console at http://localhost:9001
  minio:
    # Pulled from quay.io (Docker Hub's minio/* was rate-limited on this machine).
    image: quay.io/minio/minio:latest
    container_name: ep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    # The bucket is auto-created by the app (S3Service.onModuleInit), so no
    # separate setup container is needed.

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
